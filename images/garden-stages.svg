<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 150" width="640" height="150" role="img" aria-label="Three stages: seedling, budding, evergreen">
  <g fill="none" stroke="#6B6B6B" stroke-width="1.25">
    <circle cx="80" cy="52" r="13"/>
    <circle cx="320" cy="52" r="13"/>
    <path d="M 320 39 a 13 13 0 0 0 0 26 z" fill="#6B6B6B" stroke="none"/>
    <circle cx="560" cy="52" r="13" fill="#6B6B6B"/>
    <path d="M 120 52 H 280" stroke-dasharray="2 5"/>
    <path d="M 360 52 H 520" stroke-dasharray="2 5"/>
  </g>
  <g fill="#6B6B6B" font-family="Georgia, serif" font-size="15" text-anchor="middle">
    <text x="80" y="96">seedling</text>
    <text x="320" y="96">budding</text>
    <text x="560" y="96">evergreen</text>
  </g>
  <g fill="#6B6B6B" font-family="Georgia, serif" font-size="12.5" font-style="italic" text-anchor="middle" opacity="0.85">
    <text x="80" y="118">rough, unsure</text>
    <text x="320" y="118">taking a shape</text>
    <text x="560" y="118">settled, still tended</text>
  </g>
</svg>
